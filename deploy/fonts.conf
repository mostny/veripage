<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/opt/veripage-fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir>/var/lib/veripage/font-cache</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK SC</family><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
