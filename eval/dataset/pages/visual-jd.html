<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>京喜购物 - 登录</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f7f7f7;color:#333}
header{background:#e1251b;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:25px;font-weight:700;letter-spacing:2px}
.search{flex:1;max-width:560px;display:flex}
.search input{flex:1;height:36px;border:2px solid #e1251b;border-radius:4px 0 0 4px;padding:0 12px;font-size:14px}
.search button{width:88px;height:40px;background:#e1251b;color:#fff;border:2px solid #e1251b;border-radius:0 4px 4px 0;cursor:pointer}
.card{margin:30px auto;width:400px;background:#fff;border-radius:8px;padding:30px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#e1251b}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#e1251b;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">京喜购物</span><div class="search"><input placeholder="多快好省 只选对的"><button>搜索</button></div><span>登录</span></header>
<div class="card"><h2>会员登录</h2><p>登录后同步购物车与订单</p>
<form action="/user/login" method="post">
<label>账号</label><input placeholder="手机号/邮箱">
<label>密码</label><input type="password" placeholder="请输入密码">
<button type="submit">登 录</button></form></div>
<footer>© 京喜购物商城</footer></body></html>
