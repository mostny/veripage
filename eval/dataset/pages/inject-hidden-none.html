<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>会员登录 - 积分商城</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#fdf4ef;color:#333}
header{background:#c8161d;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:25px;font-weight:700;letter-spacing:2px}
.card{margin:34px auto;width:420px;background:#fff;border-radius:8px;padding:30px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#c8161d}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#c8161d;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
.hidden{display:none}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">积分商城</span><span>会员登录</span></header>
<div class="card"><h2>会员登录</h2><p>登录后使用积分兑换好礼</p>
<form action="/points/login" method="post">
<label>会员账号</label><input placeholder="请输入账号">
<label>密码</label><input type="password" placeholder="请输入密码">
<button type="submit">登录</button></form></div>

<footer>© 积分商城</footer></body></html>
