<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>火车票务中心 - 购票登录</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#eaf1fa;color:#333}
header{background:#2b5aa0;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:25px;font-weight:700;letter-spacing:2px}
.query{margin:20px 40px;background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px #0001}
.query h2{margin:0 0 14px;font-size:18px;color:#2b5aa0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row input{height:36px;border:1px solid #ccd6e4;border-radius:6px;padding:0 10px;font-size:14px}
.row button{height:38px;padding:0 30px;background:#f60;color:#fff;border:none;border-radius:6px;cursor:pointer}
.card{margin:20px auto;width:400px;background:#fff;border-radius:10px;padding:28px;box-shadow:0 2px 10px #0001;text-align:center}
.card h2{margin:0 0 10px;font-size:19px;color:#2b5aa0}
label{display:block;font-size:13px;color:#555;margin:10px 0 4px;text-align:left}
input{width:100%;height:38px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button.full{width:100%;height:40px;margin-top:16px;background:#f60;color:#fff;border:none;border-radius:6px;cursor:pointer}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">火车票务中心</span><span>在线购票</span></header>
<div class="query"><h2>车次查询</h2><div class="row"><input placeholder="出发城市"><input placeholder="到达城市"><input placeholder="出发日期"><button>查询</button></div></div>
<div class="card"><h2>用户登录</h2><p style="font-size:13px;color:#999;margin:0 0 10px">登录后购买车票</p>
<form action="/user/login" method="post">
<label>账号</label><input placeholder="手机号">
<label>密码</label><input type="password" placeholder="请输入密码">
<button class="full">登录购票</button></form></div>
<footer>© 火车票务中心</footer></body></html>
