<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>安全验证</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#eef2f7;color:#333}
.wrap{margin:60px auto;width:380px;background:#fff;border-radius:10px;padding:34px;text-align:center;box-shadow:0 2px 10px #0001}
.wrap h2{margin:0 0 10px;font-size:19px;color:#334}
.wrap p{margin:0 0 20px;font-size:13px;color:#888}
.captcha{width:220px;height:80px;margin:0 auto;border:1px solid #ccd;border-radius:6px;display:grid;place-items:center;color:#667;font-size:22px;letter-spacing:6px;background:#f7f9fc}
.refresh{margin-top:14px;font-size:12px;color:#69c}
footer{padding:20px;text-align:center;color:#aaa;font-size:12px}</style></head>
<body><div class="wrap"><h2>请完成安全验证</h2><p>输入下图字符后继续访问</p>
<div class="captcha">A 7 K 2</div><div class="refresh">看不清？点击刷新</div></div>
<footer>安全验证服务</footer></body></html>
