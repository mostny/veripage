<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>12306 铁路官网-余票查询与登录</title>
<style>body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#eaf1fa;color:#333}
header{background:#2b5aa0;color:#fff;padding:14px 40px;display:flex;align-items:center;gap:24px}
.logo{font-size:25px;font-weight:700;letter-spacing:2px}
.card{margin:32px auto;width:430px;background:#fff;border-radius:10px;padding:28px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:#2b5aa0}.card p{margin:0 0 16px;font-size:13px;color:#999}
label{display:block;font-size:13px;color:#555;margin:12px 0 6px}
input{width:100%;height:40px;border:1px solid #ccd;border-radius:6px;padding:0 10px;font-size:14px;box-sizing:border-box}
button{width:100%;height:42px;margin-top:18px;background:#f60;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
footer{padding:20px;text-align:center;color:#999;font-size:12px}</style></head>
<body><header><span class="logo">中国铁路 12306</span><span>官网订票</span></header>
<div class="card"><h2>12306 用户登录</h2><p>登录后查询余票并购票</p>
<form action="/otn/login" method="post">
<label>12306 账号</label><input placeholder="手机号/邮箱">
<label>密码</label><input type="password" placeholder="请输入密码">
<button type="submit">立即登录</button></form></div>
<footer>© 中国国家铁路集团有限公司</footer></body></html>
